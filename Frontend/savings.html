<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings - Manase VSLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-landmark"></i> Manase VSLA</h2>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="members.html"><i class="fas fa-users"></i> Members</a></li>
            <li><a href="join-requests.html"><i class="fas fa-user-plus"></i> Join Requests</a></li>
            <li class="active"><a href="savings.html"><i class="fas fa-piggy-bank"></i> Savings</a></li>
            <li><a href="loans.html"><i class="fas fa-hand-holding-usd"></i> Loans</a></li>
            <li><a href="welfare.html"><i class="fas fa-heartbeat"></i> Welfare</a></li>
            <li><a href="fines.html"><i class="fas fa-exclamation-circle"></i> Fines</a></li>
            <li><a href="meetings.html"><i class="fas fa-calendar-alt"></i> Meetings</a></li>
            <li><a href="shareout.html"><i class="fas fa-share-alt"></i> Share-Out</a></li>
            
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <h1><i class="fas fa-piggy-bank"></i> Savings</h1>
            <div class="user-info">
                Welcome, <span id="userName">User</span>
            <a href="#" id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
        </header>

        <div class="page-actions">
            <button class="btn-primary" id="addSavingBtn">+ Record Saving</button>
        </div>

        <div class="dashboard-cards" style="margin-bottom: 25px;">
            <div class="card">
                <h3>Total Savings</h3>
                <div class="value" id="totalSavings">MWK 0</div>
            </div>
        </div>

        <div class="table-container">
            <table id="savingsTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Member</th>
                        <th>Membership No.</th>
                        <th>Amount (MWK)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="savingsTableBody">
                    <tr>
                        <td colspan="5">Loading savings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Record Saving Modal -->
    <div id="addSavingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeSavingModal">&times;</span>
            <h2>Record Saving</h2>
            <form id="addSavingForm">
                <div class="form-group">
                    <label>Member</label>
                    <select id="saving_member_id" required>
                        <option value="">Select Member</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (MWK)</label>
                    <input type="number" id="saving_amount" required min="1" placeholder="Enter amount">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="saving_date" required>
                </div>
                <button type="submit" class="btn-primary">Save</button>
            </form>
            <p id="savingFormMessage" class="error-message"></p>
        </div>
    </div>

    <!-- Edit Saving Modal -->
    <div id="editSavingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeEditSavingModal">&times;</span>
            <h2>Edit Saving</h2>
            <form id="editSavingForm">
                <input type="hidden" id="edit_saving_id">
                <div class="form-group">
                    <label>Amount (MWK)</label>
                    <input type="number" id="edit_saving_amount" required min="1">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="edit_saving_date" required>
                </div>
                <button type="submit" class="btn-primary">Update Saving</button>
            </form>
            <p id="editSavingMessage" class="error-message"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/savings.js"></script>
</body>
</html>
