<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manase VSLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
       .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(135deg, rgba(27,122,78,0.45), rgba(20,92,59,0.50)),
    url('images/login-bg.jpg')
    center/cover no-repeat;
    padding: 20px;
}

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-box {
            background: white;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            text-align: center;
            border-top: 5px solid #1b7a4e;
        }

        .login-box .logo-icon {
            margin-bottom: 10px;
        }

        .login-box h1 {
            color: #1b7a4e;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .login-box .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-box .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .login-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #1b7a4e;
        }

        .login-box .btn-primary {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 16px;
            background-color: #1b7a4e;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .login-box .btn-primary:hover {
            background-color: #145c3b;
        }

        .error-message {
            color: #d93025;
            margin-top: 14px;
            font-size: 14px;
            min-height: 20px;
        }

        .forgot-link {
            display: inline-block;
            margin-top: 14px;
            color: #1b7a4e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 12px;
            color: #1b7a4e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="login-box">
            <div class="logo-icon">
                <img src="images/logo.png" alt="Manase VSLA Logo" style="height: 90px; width: auto; border-radius: 8px;">
            </div>
            <h1>Manase VSLA</h1>
            <p class="subtitle">Village Savings & Loan Association</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <p id="errorMessage" class="error-message"></p>

            <a href="forgot-password.html" class="forgot-link">
                Forgot Password?
            </a>

            <br>

            <a href="home.html" class="back-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
