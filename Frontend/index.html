<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manase VSLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg, rgba(27,122,78,0.45), rgba(20,92,59,0.50)),
                url('images/login-bg.jpg') center/cover no-repeat;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-box {
            background: white;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            text-align: center;
            border-top: 5px solid #c9a227;
        }

        .login-box .logo-icon {
            margin-bottom: 10px;
        }

        .login-box h1 {
            color: #1b7a4e;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .login-box .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-box .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .login-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #1b7a4e;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            width: 100%;
            padding-right: 42px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            color: #666;
            font-size: 15px;
        }

        .toggle-password:hover {
            color: #1b7a4e;
        }

        .login-box .btn-primary {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 16px;
            background-color: #1b7a4e;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .login-box .btn-primary:hover {
            background-color: #145c3b;
        }

        .error-message {
            color: #d93025;
            margin-top: 14px;
            font-size: 14px;
            min-height: 20px;
        }

        .login-links {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-link {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-forgot {
            background: #fff8e7;
            color: #9a7b1a;
            border: 1px solid #e6d29a;
        }

        .btn-forgot:hover {
            background: #c9a227;
            color: white;
            border-color: #c9a227;
        }

        .btn-home {
            background: #eef8f1;
            color: #1b7a4e;
            border: 1px solid #b7dfc8;
        }

        .btn-home:hover {
            background: #1b7a4e;
            color: white;
            border-color: #1b7a4e;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="login-box">
            <div class="logo-icon">
                <img src="images/logo.png" alt="Manase VSLA Logo" style="height: 90px; width: auto; border-radius: 8px;">
            </div>
            <h1>Manase VSLA</h1>
            <p class="subtitle">Village Savings & Loan Association</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" class="toggle-password" data-target="password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <p id="errorMessage" class="error-message"></p>

            <div class="login-links">
                <a href="forgot-password.html" class="btn-link btn-forgot">
                    <i class="fas fa-key"></i> Forgot Password?
                </a>
                <a href="home.html" class="btn-link btn-home">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Show / hide password
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('i');
                if (!input) return;
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });
    </script>
</body>
</html>
