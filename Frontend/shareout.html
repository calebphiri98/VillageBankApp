<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share-Out - Manase VSLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
     <div class="sidebar">
   <div class="sidebar-header">
    <h2>
        <img src="images/logo.png" alt="Logo" style="height: 48px; width: auto; vertical-align: middle; border-radius: 4px; margin-right: 6px;">
        Manase VSLA
    </h2>
</div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="members.html"><i class="fas fa-users"></i> Members</a></li>
            <li><a href="join-requests.html"><i class="fas fa-user-plus"></i> Join Requests</a></li>
            <li><a href="savings.html"><i class="fas fa-piggy-bank"></i> Savings</a></li>
            <li><a href="loans.html"><i class="fas fa-hand-holding-usd"></i> Loans</a></li>
            <li><a href="welfare.html"><i class="fas fa-heartbeat"></i> Welfare</a></li>
            <li><a href="fines.html"><i class="fas fa-exclamation-circle"></i> Fines</a></li>
            <li><a href="meetings.html"><i class="fas fa-calendar-alt"></i> Meetings</a></li>
            <li class="active"><a href="shareout.html"><i class="fas fa-share-alt"></i> Share-Out</a></li>
           
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <h1><i class="fas fa-share-alt"></i> Share-Out</h1>
            <div class="user-info">
                Welcome, <span id="userName">User</span>
            <a href="#" id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </header>

        <div class="page-actions">
            <button class="btn-primary" id="performShareOutBtn">Calculate Share-Out</button>
        </div>

        <!-- Breakdown Cards (shown after calculation) -->
        <div class="dashboard-cards" id="breakdownCards" style="margin-bottom: 25px; display: none;">
            <!-- Will be filled by JavaScript -->
        </div>

        <!-- Share Results -->
        <div class="table-container" id="sharesContainer" style="display: none;">
            <h2 style="padding: 15px 20px 10px; font-size: 18px;">Member Shares</h2>
            <table>
                <thead>
                    <tr>
                        <th>Membership No.</th>
                        <th>Full Name</th>
                        <th>Member Savings</th>
                        <th>Share Amount</th>
                    </tr>
                </thead>
                <tbody id="sharesTableBody">
                </tbody>
            </table>
        </div>

        <!-- Previous Share-Outs -->
        <div class="table-container" style="margin-top: 30px;">
            <h2 style="padding: 15px 20px 10px; font-size: 18px;">Previous Share-Outs</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Total Fund</th>
                        <th>Members</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr>
                        <td colspan="4">Loading history...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shareout.js"></script>
</body>
</html>
