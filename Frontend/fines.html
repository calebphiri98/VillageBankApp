<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fines - Manase VSLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Manase VSLA</h2>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="members.html">Members</a></li>
            <li><a href="savings.html">Savings</a></li>
            <li><a href="loans.html">Loans</a></li>
            <li><a href="welfare.html">Welfare</a></li>
            <li class="active"><a href="fines.html">Fines</a></li>
            <li><a href="meetings.html">Meetings</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="shareout.html">Share-Out</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <h1>Fines</h1>
            <div class="user-info">
                Welcome, <span id="userName">User</span>
            </div>
        </header>

        <!-- Summary Card -->
        <div class="dashboard-cards" style="margin-bottom: 25px;">
            <div class="card">
                <h3>Total Fines</h3>
                <div class="value" id="totalFines">MWK 0</div>
            </div>
        </div>

        <div class="page-actions">
            <button class="btn-primary" id="addFineBtn">+ Record Fine</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Member</th>
                        <th>Membership No.</th>
                        <th>Amount (MWK)</th>
                        <th>Reason</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="finesTableBody">
                    <tr>
                        <td colspan="6">Loading fines...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Record Fine Modal -->
    <div id="addFineModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeFineModal">&times;</span>
            <h2>Record Fine</h2>
            <form id="addFineForm">
                <div class="form-group">
                    <label>Member</label>
                    <select id="fine_member_id" required>
                        <option value="">Select Member</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (MWK)</label>
                    <input type="number" id="fine_amount" required min="1" placeholder="Enter fine amount">
                </div>
                <div class="form-group">
                    <label>Reason</label>
                    <input type="text" id="fine_reason" required placeholder="e.g. Late savings, Absenteeism">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="fine_date" required>
                </div>
                <button type="submit" class="btn-primary">Save Fine</button>
            </form>
            <p id="fineFormMessage" class="error-message"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/fines.js"></script>
</body>
</html>
