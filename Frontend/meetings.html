<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings - Manase VSLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
    <div class="sidebar-header">
    <h2>
        <img src="images/logo.png" alt="Logo" style="height: 48px; width: auto; vertical-align: middle; border-radius: 4px; margin-right: 6px;">
        Manase VSLA
    </h2>
</div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="members.html"><i class="fas fa-users"></i> Members</a></li>
            <li><a href="join-requests.html"><i class="fas fa-user-plus"></i> Join Requests</a></li>
            <li><a href="savings.html"><i class="fas fa-piggy-bank"></i> Savings</a></li>
            <li><a href="loans.html"><i class="fas fa-hand-holding-usd"></i> Loans</a></li>
            <li><a href="welfare.html"><i class="fas fa-heartbeat"></i> Welfare</a></li>
            <li><a href="fines.html"><i class="fas fa-exclamation-circle"></i> Fines</a></li>
            <li class="active"><a href="meetings.html"><i class="fas fa-calendar-alt"></i> Meetings</a></li>
            <li><a href="shareout.html"><i class="fas fa-share-alt"></i> Share-Out</a></li>

        </ul>
    </div>

    <div class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <h1><i class="fas fa-calendar-alt"></i> Meetings</h1>
            <div class="user-info">
               Welcome, <span id="userName">User</span>
            <a href="#" id="logoutBtn" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </header>

        <div class="page-actions">
            <button class="btn-primary" id="addMeetingBtn">+ Record Meeting</button>
        </div>

        <div class="table-container">
            <table id="meetingsTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Notes</th>
                        <th>Recorded By</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="meetingsTableBody">
                    <tr>
                        <td colspan="4">Loading meetings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Record Meeting Modal -->
    <div id="addMeetingModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" id="closeMeetingModal">&times;</span>
            <h2>Record Meeting</h2>
            <form id="addMeetingForm">
                <div class="form-group">
                    <label>Meeting Date</label>
                    <input type="date" id="meeting_date" required>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="meeting_notes" rows="3" placeholder="Optional meeting notes" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;"></textarea>
                </div>
                <div class="form-group">
                    <label>Attendance</label>
                    <div id="attendanceList" style="max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px;"></div>
                </div>
                <button type="submit" class="btn-primary">Save Meeting</button>
            </form>
            <p id="meetingFormMessage" class="error-message"></p>
        </div>
    </div>

    <!-- View Attendance Modal -->
    <div id="viewAttendanceModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeAttendanceModal">&times;</span>
            <h2>Meeting Attendance</h2>
            <div id="attendanceContent" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/meetings.js"></script>
</body>
</html>
