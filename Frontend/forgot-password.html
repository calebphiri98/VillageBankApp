<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Manase VSLA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(135deg, rgba(27,122,78,0.45), rgba(20,92,59,0.50)),
    url('images/reset-bg.jpg')
    center/cover no-repeat;
    padding: 20px;
}

        .login-box {
            background: white;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 420px;
            border-top: 5px solid #1b7a4e;
        }

        .login-box h1 {
            color: #1b7a4e;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1b7a4e;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background-color: #1b7a4e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: #145c3b;
        }

        .error-message {
            margin-top: 14px;
            font-size: 14px;
            min-height: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #1b7a4e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-box">
        <h1><i class="fas fa-key"></i> Reset Password</h1>
        <p class="subtitle">Enter your username, phone number, and new password</p>

        <form id="forgotForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" required placeholder="e.g. 0888123456">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new_password" required placeholder="At least 6 characters">
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirm_password" required placeholder="Repeat new password">
            </div>

            <button type="submit" class="btn-primary">Reset Password</button>
        </form>

        <p id="message" class="error-message"></p>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageEl = document.getElementById('message');
            messageEl.textContent = '';

            const username = document.getElementById('username').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (new_password !== confirm_password) {
                messageEl.style.color = 'red';
                messageEl.textContent = 'Passwords do not match';
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, phone, new_password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Failed to reset password');
                }

                messageEl.style.color = 'green';
                messageEl.textContent = result.message;

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                messageEl.style.color = 'red';
                messageEl.textContent = error.message;
            }
        });
    </script>
</body>
</html>
